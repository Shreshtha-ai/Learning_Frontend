<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUILDING LOADING SCREEN</title>
    <style>
        h1{
            text-align: center;
            color: rgb(143, 17, 17);
            
        }
        .loader{ 
            position: absolute;
            top:40%;
            left: 47%;
            z-index: 1000;
            width: 120px;
            height: 120px;
            border: 10px solid #f3f3f3;
            border-radius: 50% ;
            animation: spin 3s linear infinite;
            border-top: 10px solid #5a4fde ;  
            /* border-left: 10px solid red;       */
        }

        @keyframes spin{
            0%{
                transform: rotate(0deg);
            }

            100%{
                transform: rotate(360deg);
                
                
            }
        }
    </style>
</head>
<body>
    <h1>Building loader</h1>
    <div class = "loader">

    </div>
    
</body>
</html>
